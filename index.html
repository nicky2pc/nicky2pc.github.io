<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DVP</title>
<meta name="description" content="DVP: GitHub, Telegram, email.">
<meta name="theme-color" content="#06141b">
<link rel="icon" href="logo.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #06141b; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  nav {
    position: fixed; left: 0; right: 0; bottom: max(26px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: clamp(18px, 4vw, 40px);
    font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .2em; text-transform: uppercase; z-index: 2;
  }
  nav a {
    color: rgba(255, 255, 255, .86); text-decoration: none; padding: 10px 2px;
    border-bottom: 1px solid transparent; text-shadow: 0 1px 12px rgba(0, 0, 0, .55);
    transition: color .2s, border-color .2s;
  }
  nav a:hover, nav a:focus-visible { color: #fff; border-bottom-color: rgba(255, 255, 255, .75); outline: none; }
  .fallback {
    display: none; position: fixed; inset: 0; place-items: center; margin: 0;
    font: 900 clamp(84px, 24vw, 300px)/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .03em;
    background: linear-gradient(180deg, #ffffff 0%, #a9b6c2 47%, #39444e 53%, #e9eef3 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .no-gl body { background: linear-gradient(180deg, #23486b 0%, #b9c9d2 50%, #0f3239 50.4%, #031015 100%); }
  .no-gl canvas { display: none; }
  .no-gl .fallback { display: grid; }
</style>
<noscript><style>canvas { display: none; } .fallback { display: grid; } body { background: linear-gradient(180deg, #23486b 0%, #b9c9d2 50%, #0f3239 50.4%, #031015 100%); }</style></noscript>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<h1 class="sr-only">DVP</h1>
<p class="fallback" aria-hidden="true">DVP</p>
<nav aria-label="Links">
  <a href="https://github.com/nicky2pc" target="_blank" rel="noopener">GitHub</a>
  <a href="https://t.me/nicky2pc" target="_blank" rel="noopener">Telegram</a>
  <a href="mailto:explore3web@gmail.com">Email</a>
</nav>

<script id="fs" type="x-shader/x-fragment">
// Two passes share this source: PASS_BG draws the sea and the sky at a reduced
// resolution into a texture; the final pass draws the letters at the screen's
// own resolution over that texture.
#ifdef NO_HIGHP
precision mediump float;
#else
precision highp float;
#endif
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uLet;   // letters: yaw, pitch, scale
uniform float uDist; // letters: distance ahead of the camera
uniform sampler2D uBg;

#define SEA_DEPTH 1.0
vec3 SUN;
vec3 L_center;
mat3 L_rot;
float L_scale;

float hash(vec2 p) { return fract(sin(dot(p, vec2(41.31, 289.17))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float clouds(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    s += a * vnoise(p);
    p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.1;
    a *= 0.5;
  }
  return s;
}

// The sea: a sum of travelling waves, each pulling the next ones toward its
// crests so the crests come out sharp and the troughs wide.
float waves(vec2 p, int n) {
  float ang = 0.0, freq = 0.9, speed = 1.3, w = 1.0, sum = 0.0, wsum = 0.0;
  for (int i = 0; i < 30; i++) {
    if (i >= n) break;
    vec2 d = vec2(cos(ang), sin(ang));
    float x = dot(d, p) * freq + uTime * speed;
    float e = exp(sin(x) - 1.0);
    p -= d * e * cos(x) * w * 0.34;
    sum += e * w;
    wsum += w;
    w *= 0.79; freq *= 1.19; speed *= 1.065; ang += 2.39996;
  }
  return sum / wsum;
}
float seaH(vec2 p, int n) { return (waves(p * 0.5, n) - 1.0) * SEA_DEPTH; }

vec3 seaNormal(vec2 p, float e, int n) {
  float h = seaH(p, n);
  return normalize(vec3(h - seaH(p + vec2(e, 0.0), n), e, h - seaH(p + vec2(0.0, e), n)));
}

vec3 sky(vec3 rd) {
  float y = max(rd.y, 0.0);
  vec3 c = mix(vec3(0.74, 0.79, 0.84), vec3(0.06, 0.17, 0.37), pow(y, 0.45));
  float s = max(dot(rd, SUN), 0.0);
  // a high, thin cloud deck, lit from the sun's side
  if (rd.y > 0.0) {
    vec2 cp = rd.xz / (rd.y + 0.06) * 0.5 + vec2(uTime * 0.012, 0.0);
    float n = clouds(cp);
    float cl = smoothstep(0.40, 0.80, n) * smoothstep(0.0, 0.14, rd.y);
    vec3 lit = mix(vec3(0.82, 0.85, 0.89), vec3(1.0, 0.89, 0.74), pow(s, 3.0));
    vec3 shade = vec3(0.42, 0.48, 0.56);
    c = mix(c, mix(lit, shade, smoothstep(0.62, 0.95, n) * 0.7), cl * 0.75);
  }
  c += vec3(1.0, 0.78, 0.52) * (0.20 * pow(s, 6.0) + 0.6 * pow(s, 60.0));
  c += vec3(1.0, 0.94, 0.85) * 6.0 * smoothstep(0.99986, 0.99994, s);
  return c;
}
vec3 horizon(vec3 rd) { return sky(normalize(vec3(rd.x, 0.0, rd.z))); }

// ---- the letters: D, V and P as 2D shapes, extruded with rounded edges ----
float sdBox2(vec2 p, vec2 b) {
  vec2 d = abs(p) - b;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}
// A box whose right corners are rounded with radius r. With r no larger than
// either half side the distance stays continuous across x = 0.
float sdBoxR(vec2 p, vec2 b, float r) {
  float k = p.x > 0.0 ? r : 0.0;
  vec2 q = abs(p) - b + k;
  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - k;
}
float sdSeg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
}
float glyphD(vec2 p) {
  return max(sdBoxR(p, vec2(0.75, 1.0), 0.75), -sdBoxR(p - vec2(0.05, 0.0), vec2(0.37, 0.58), 0.37));
}
float glyphV(vec2 p) {
  p.x = abs(p.x);
  return max(sdSeg(p, vec2(0.64, 1.25), vec2(0.0, -0.95)) - 0.215, abs(p.y) - 1.0);
}
float glyphP(vec2 p) {
  float stem = sdBox2(p - vec2(-0.5, 0.0), vec2(0.21, 1.0));
  float bowl = max(sdBoxR(p - vec2(0.0, 0.42), vec2(0.71, 0.58), 0.56), -sdBoxR(p - vec2(-0.02, 0.42), vec2(0.31, 0.17), 0.17));
  return min(stem, bowl);
}
float dvp2(vec2 p) {
  return min(glyphD(p - vec2(-1.86, 0.0)), min(glyphV(p), glyphP(p - vec2(1.82, 0.0))));
}
float sdLetters(vec3 p) {
  const float depth = 0.30, r = 0.07;
  vec2 w = vec2(dvp2(p.xy) + r, abs(p.z) - depth + r);
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - r;
}
vec3 lettersNormal(vec3 p) {
  const vec2 k = vec2(1.0, -1.0);
  const float e = 0.0012;
  return normalize(k.xyy * sdLetters(p + k.xyy * e) + k.yyx * sdLetters(p + k.yyx * e) +
                   k.yxy * sdLetters(p + k.yxy * e) + k.xxx * sdLetters(p + k.xxx * e));
}
// World ray against the letters: their box first, then a march inside it.
// `pix` is the angular size of a pixel: a ray that passes within one pixel of
// the surface still counts, and `cover` says how much of the pixel it covers.
bool hitLetters(vec3 ro, vec3 rd, int steps, float pix, out float tW, out vec3 nW, out float cover) {
  tW = 0.0; nW = vec3(0.0, 1.0, 0.0); cover = 0.0;
  vec3 o = (ro - L_center) * L_rot / L_scale;
  vec3 d = rd * L_rot;
  vec3 s = vec3(d.x < 0.0 ? -1.0 : 1.0, d.y < 0.0 ? -1.0 : 1.0, d.z < 0.0 ? -1.0 : 1.0);
  vec3 inv = s / max(abs(d), vec3(1e-5));
  vec3 t0 = (vec3(-2.70, -1.10, -0.40) - o) * inv, t1 = (vec3(2.60, 1.10, 0.40) - o) * inv;
  vec3 tmin = min(t0, t1), tmax = max(t0, t1);
  float tn = max(max(tmin.x, tmin.y), max(tmin.z, 0.0));
  float tf = min(min(tmax.x, tmax.y), tmax.z);
  if (tf < tn) return false;
  float t = tn, dmin = 1e9, tBest = tn;
  bool left = false;
  for (int i = 0; i < 128; i++) {
    if (i >= steps) break;
    vec3 p = o + d * t;
    float dist = sdLetters(p);
    if (dist < dmin) { dmin = dist; tBest = t; }
    if (dist < 0.0008) { dmin = 0.0; break; }
    t += dist * 0.95;
    if (t > tf) { left = true; break; }
  }
  // A ray that ran out of steps inside the box is creeping along a surface:
  // a hit. One that left the box covers the pixel by how near it passed.
  float fp = max(pix * tBest, 0.003);
  if (left) {
    if (dmin > fp) return false;
    cover = 1.0 - smoothstep(0.0, fp, dmin);
  } else {
    cover = 1.0;
  }
  tW = tBest * L_scale;
  nW = L_rot * lettersNormal(o + d * tBest);
  return cover > 0.0;
}

// What a reflection that points down sees: the sea, without tracing it. It
// meets the sky at the horizon, so chrome shows no hard seam there.
vec3 seaBelow(vec3 r) {
  float f = exp(min(r.y, 0.0) * 30.0);
  return mix(vec3(0.045, 0.095, 0.120), horizon(r), f);
}
vec3 chrome(vec3 rd, vec3 n) {
  vec3 r = reflect(rd, n);
  vec3 env = r.y >= 0.0 ? sky(r) : seaBelow(r);
  float ndv = max(dot(n, -rd), 0.0);
  vec3 f0 = vec3(0.90, 0.90, 0.92);
  vec3 c = env * (f0 + (1.0 - f0) * pow(1.0 - ndv, 5.0));
  c += vec3(1.0, 0.88, 0.70) * 2.2 * pow(max(dot(r, SUN), 0.0), 80.0);
  return c;
}

float traceSea(vec3 ro, vec3 rd) {
  if (rd.y > -0.0008) return -1.0;
  float t = max(-ro.y / rd.y, 0.0);
  float tEnd = min((-SEA_DEPTH - ro.y) / rd.y, 900.0);
  float tPrev = t;
  for (int i = 0; i < 64; i++) {
    vec3 p = ro + rd * t;
    float h = p.y - seaH(p.xz, 8);
    if (h < 0.0) {
      float a = tPrev, b = t;
      for (int j = 0; j < 7; j++) {
        float m = 0.5 * (a + b);
        vec3 q = ro + rd * m;
        if (q.y - seaH(q.xz, 8) < 0.0) b = m; else a = m;
      }
      return 0.5 * (a + b);
    }
    tPrev = t;
    t += min(max(h * 0.55 / -rd.y, 0.02), 0.3 + 0.12 * t);
    if (t > tEnd) return tEnd;
  }
  return t;
}

vec3 shadeSea(vec3 ro, vec3 rd, float t) {
  vec3 p = ro + rd * t;
  int it = t < 22.0 ? 28 : (t < 70.0 ? 18 : 10);
  vec3 n = seaNormal(p.xz, 0.004 + 0.002 * t, it);
  n = normalize(mix(n, vec3(0.0, 1.0, 0.0), clamp(t * 0.0035, 0.0, 0.7)));
  vec3 r = reflect(rd, n);
  r.y = abs(r.y);
  float fres = 0.02 + 0.98 * pow(clamp(1.0 - dot(n, -rd), 0.0, 1.0), 5.0);
  vec3 refl = sky(r);
  float tl, cv; vec3 nl;
  // The letters in the water, but not in the near swell: there their
  // reflection breaks into dark blots.
  if (t > 4.0 && hitLetters(p + n * 0.02, r, 40, 0.0, tl, nl, cv)) refl = mix(refl, chrome(r, nl), cv * smoothstep(4.0, 9.0, t));
  float crest = clamp((p.y + 0.85 * SEA_DEPTH) / (0.85 * SEA_DEPTH), 0.0, 1.0);
  vec3 body = mix(vec3(0.018, 0.068, 0.090), vec3(0.060, 0.225, 0.245), crest * crest);
  body *= 0.6 + 0.4 * max(dot(n, SUN), 0.0);
  body += vec3(0.020, 0.032, 0.042) * (0.5 + 0.5 * n.y);
  body += vec3(0.06, 0.20, 0.17) * pow(crest, 4.0) * pow(max(dot(rd, SUN), 0.0), 2.0) * 0.8;
  vec3 c = mix(body, refl, fres);
  c += vec3(1.0, 0.86, 0.62) * 3.0 * pow(max(dot(r, SUN), 0.0), 260.0);
  return c;
}

mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c); }
mat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1.0, 0.0, 0.0, 0.0, c, s, 0.0, -s, c); }
vec3 tonemap(vec3 c) { return pow(1.0 - exp(-c * 1.25), vec3(0.94)); }

void main() {
  SUN = normalize(vec3(-0.50, 0.10, -0.86));
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  float t = uTime;

  vec3 ro = vec3(0.0, 2.35 + 0.06 * sin(t * 0.6), -t * 1.3);
  float roll = 0.02 * sin(t * 0.33);
  vec3 fw = normalize(vec3(0.0, -0.07, -1.0));
  vec3 rt0 = vec3(cos(roll), sin(roll), 0.0);
  vec3 up = normalize(cross(rt0, fw));
  vec3 rt = cross(fw, up);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.9 * fw);

  L_scale = uLet.z;
  L_center = ro + vec3(0.0, 0.04 * sin(t * 0.8), -uDist);
  L_rot = rotY(uLet.x + 0.16 * sin(t * 0.31)) * rotX(uLet.y + 0.035 * sin(t * 0.47));

#ifdef PASS_BG
  vec3 col;
  float ts = traceSea(ro, rd);
  if (ts > 0.0) {
    col = shadeSea(ro, rd, ts);
    col = mix(col, horizon(rd), 1.0 - exp(-ts * 0.0065));
  } else {
    col = sky(rd);
  }
  gl_FragColor = vec4(tonemap(col), 1.0);
#else
  vec2 q = gl_FragCoord.xy / uRes;
  vec3 col = texture2D(uBg, q).rgb;
  float tl, cover; vec3 nl;
  if (hitLetters(ro, rd, 128, 2.0 / (uRes.y * 1.9), tl, nl, cover)) col = mix(col, tonemap(chrome(rd, nl)), cover);
  col *= 0.62 + 0.38 * pow(16.0 * q.x * q.y * (1.0 - q.x) * (1.0 - q.y), 0.16);
  col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
#endif
}
</script>
<script>
(() => {
  const root = document.documentElement;
  const canvas = document.getElementById("c");
  const fail = (why) => { if (why) console.warn("DVP: " + why); root.classList.add("no-gl"); };

  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: "high-performance" });
  if (!gl) return fail("no WebGL");

  const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  const fsBody = (hp && hp.precision > 0 ? "" : "#define NO_HIGHP\n") + document.getElementById("fs").textContent;
  const vsSource = "attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }";

  // bg: sea and sky into a texture at a reduced size; fin: letters at full size.
  let bg, fin, tex, fbo, buf;
  function program(defines) {
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) throw new Error(gl.getShaderInfoLog(s) || "shader");
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, defines + fsBody));
    gl.bindAttribLocation(p, 0, "a");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error(gl.getProgramInfoLog(p) || "link");
    const u = (n) => gl.getUniformLocation(p, n);
    return { p, res: u("uRes"), time: u("uTime"), let: u("uLet"), dist: u("uDist"), bg: u("uBg") };
  }
  function build() {
    bg = program("#define PASS_BG\n");
    fin = program("");
    buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    fbo = gl.createFramebuffer();
  }
  try { build(); } catch (e) { return fail(e.message); }

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fixed = window.DVP_FIXED_QUALITY === true; // screenshots: no adapting
  const DIST = 9.0, FL = 1.9, WIDTH = 5.4;
  let bgQuality = 0.7, finScale = 1, letScale = 1, bgW = 1, bgH = 1;

  function resize() {
    const cssW = Math.max(1, window.innerWidth), cssH = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fit = (w, h, max) => { const k = Math.min(1, Math.sqrt(max / (w * h))); return [Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k))]; };
    [canvas.width, canvas.height] = fit(cssW * dpr * finScale, cssH * dpr * finScale, 6.5e6);
    [bgW, bgH] = fit(cssW * dpr * bgQuality, cssH * dpr * bgQuality, 1.7e6);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, bgW, bgH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const aspect = cssW / cssH;
    const share = aspect >= 1.2 ? 0.52 : aspect <= 0.75 ? 0.86 : 0.86 - (aspect - 0.75) / 0.45 * 0.34;
    letScale = share * 2 * aspect * DIST / FL / WIDTH;
    if (reduce) draw(performance.now());
  }

  // Drag turns the letters; they drift back when let go.
  let yaw = 0, pitch = 0, yawGoal = 0, pitchGoal = 0, drag = null;
  canvas.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    yawGoal += (e.clientX - drag.x) * 0.006;
    pitchGoal = Math.max(-0.55, Math.min(0.55, pitchGoal + (e.clientY - drag.y) * 0.004));
    drag.x = e.clientX; drag.y = e.clientY;
    if (reduce) { yaw = yawGoal; pitch = pitchGoal; draw(performance.now()); }
  });
  const release = () => { drag = null; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  const T0 = 9.0;
  function pass(prog, w, h, time) {
    gl.viewport(0, 0, w, h);
    gl.useProgram(prog.p);
    gl.uniform2f(prog.res, w, h);
    gl.uniform1f(prog.time, time);
    gl.uniform3f(prog.let, yaw, pitch, letScale);
    gl.uniform1f(prog.dist, DIST);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function draw(now) {
    const time = reduce ? 18.0 : T0 + now / 1000;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    pass(bg, bgW, bgH, time);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.useProgram(fin.p);
    gl.uniform1i(fin.bg, 0);
    pass(fin, canvas.width, canvas.height, time);
  }

  // Keep the frame rate up on slow GPUs: first the sea gets fewer pixels, the
  // letters only after it reached its floor.
  let last = 0, acc = 0, frames = 0, running = true;
  function frame(now) {
    if (!running) return;
    if (last && !fixed) {
      acc += now - last; frames++;
      if (frames === 30) {
        const avg = acc / frames;
        if (avg > 24) {
          if (bgQuality > 0.34) bgQuality = Math.max(0.34, bgQuality * 0.82);
          else if (finScale > 0.5) finScale = Math.max(0.5, finScale * 0.85);
          resize();
        } else if (avg < 13) {
          if (finScale < 1) finScale = Math.min(1, finScale * 1.12);
          else if (bgQuality < 1) bgQuality = Math.min(1, bgQuality * 1.12);
          resize();
        }
        acc = 0; frames = 0;
      }
    }
    last = now;
    if (!drag) { yawGoal *= 0.985; pitchGoal *= 0.97; }
    yaw += (yawGoal - yaw) * 0.12;
    pitch += (pitchGoal - pitch) * 0.12;
    draw(now);
    requestAnimationFrame(frame);
  }

  canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); running = false; });
  canvas.addEventListener("webglcontextrestored", () => {
    try { build(); } catch (err) { return fail(err.message); }
    running = !reduce; last = 0; resize();
    if (running) requestAnimationFrame(frame);
  });

  window.addEventListener("resize", resize);
  if (fixed) bgQuality = 1;
  resize();
  if (reduce) draw(performance.now());
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
